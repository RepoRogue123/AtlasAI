{% extends "_portal_base.html" %}
{% block title %}Globex Portal - Sign in{% endblock %}
{% block content %}
<form class="card" method="post" action="/portal/login" style="max-width:420px;margin:40px auto">
  <h1>Sign in</h1>
  {% if error %}<div class="errors" role="alert">{{ error }}</div>{% endif %}
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <div style="margin-top:16px"><button class="btn" type="submit">Sign in</button></div>
</form>
{% endblock %}
