<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Northwind Corp{% endblock %}</title>
<style>
  :root { --accent: {% block accent %}#334155{% endblock %}; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
  header.app { background: var(--accent); color: #fff; padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 52px; }
  header.app .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  header.app nav a { color: #fff; opacity: .85; text-decoration: none; margin-right: 16px; }
  header.app nav a:hover { opacity: 1; text-decoration: underline; }
  main { max-width: 1040px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; } h2 { font-size: 17px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #e2e8f0; }
  th { background: #f8fafc; font-size: 12px; text-transform: uppercase; color: #64748b; letter-spacing: .4px; }
  tr.unread td { font-weight: 600; }
  a { color: var(--accent); }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; cursor: pointer; text-decoration: none; }
  .btn.secondary { background: #e2e8f0; color: #1e293b; }
  .btn.danger { background: #b91c1c; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; background: #fff; }
  textarea { min-height: 120px; }
  .flash { background: #dcfce7; border: 1px solid #86efac; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .errors { background: #fee2e2; border: 1px solid #fca5a5; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.open { background: #fef3c7; color: #92400e; } .badge.paid, .badge.closed { background: #dcfce7; color: #166534; }
  .badge.overdue { background: #fee2e2; color: #991b1b; }
  .muted { color: #64748b; } .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  pre.body { white-space: pre-wrap; font: inherit; }
  #consent-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  #consent-overlay .box { background: #fff; padding: 24px; border-radius: 12px; max-width: 420px; }
</style>
</head>
<body>
<header class="app">
  <span class="brand">{% block brand %}Northwind Corp{% endblock %}</span>
  <nav>{% block nav %}{% endblock %}</nav>
</header>
<main>
  {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
{% if chaos_modal %}
<div id="consent-overlay" role="dialog" aria-modal="true" aria-label="Cookie consent">
  <div class="box">
    <h2>We value your privacy</h2>
    <p>We use cookies to improve your experience. Please accept to continue using this application.</p>
    <button class="btn" onclick="document.getElementById('consent-overlay').remove()">Accept all cookies</button>
  </div>
</div>
{% endif %}
</body>
</html>
